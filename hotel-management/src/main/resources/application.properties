spring.application.name=hotel-management

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Multipart file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# JWT Configuration
jwt.secret=${JWT_SECRET:hotel_management_jwt_secret_key_2024_local_dev}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging Configuration
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.hotel.management=${LOG_LEVEL:INFO}

# SpringDoc / Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.try-it-out-enabled=true
